name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browsers:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop-chromium, browser: chromium }
          - { project: mobile-chromium, browser: chromium }
          - { project: desktop-firefox, browser: firefox }
          - { project: desktop-webkit, browser: webkit }
          - { project: mobile-webkit, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7
